name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Assinatura de release opcional: configure os secrets KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD no repositório. Sem eles o
      # APK de release sai assinado com a chave de debug (ainda instalável).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "grid-of-thieves-$version.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "grid-of-thieves-$version-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: grid-of-thieves-*.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: app/build/reports/

  # Publica um Release quando o versionName do app/build.gradle.kts ganha uma
  # tag nova. A tag é criada aqui pelo GITHUB_TOKEN porque sessões de nuvem do
  # Claude Code só podem empurrar branches; basta subir o bump de versão na main.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          tag="v$name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag já existe; nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.version.outputs.publish == 'true'
        with:
          name: apk

      - name: Name APKs after the tag
        if: steps.version.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          mv grid-of-thieves-main.apk "grid-of-thieves-$tag.apk"
          mv grid-of-thieves-main-debug.apk "grid-of-thieves-$tag-debug.apk"

      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && steps.version.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: grid-of-thieves-*.apk
          generate_release_notes: true
